services:
  qbittorrent:
    image: linuxserver/qbittorrent:latest
    container_name: auto-rss-qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Shanghai
      - WEBUI_PORT=8080
    volumes:
      - ./data/qbittorrent/config:/config
      - ./data/downloads:/downloads
    ports:
      - 8080:8080      # Web UI
      - 6881:6881      # BT TCP
      - 6881:6881/udp  # BT UDP
    restart: unless-stopped
    networks:
      - auto-rss-network

networks:
  auto-rss-network:
    name: auto-rss-network
    driver: bridge
